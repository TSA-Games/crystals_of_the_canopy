<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f6ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="800" height="350" fill="url(#skyGrad)"/>
  
  <!-- Clouds -->
  <ellipse cx="150" cy="80" rx="60" ry="35" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="200" cy="85" rx="50" ry="30" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="550" cy="120" rx="65" ry="32" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="600" cy="125" rx="55" ry="28" fill="#ffffff" opacity="0.7"/>
  
  <!-- Far forest (dark green) -->
  <rect y="300" width="800" height="300" fill="#2d5016"/>
  
  <!-- Far tree silhouettes -->
  <ellipse cx="100" cy="330" rx="50" ry="70" fill="#1a3d1a" opacity="0.8"/>
  <ellipse cx="250" cy="320" rx="60" ry="80" fill="#1a3d1a" opacity="0.8"/>
  <ellipse cx="400" cy="330" rx="55" ry="75" fill="#1a3d1a" opacity="0.8"/>
  <ellipse cx="550" cy="320" rx="65" ry="85" fill="#1a3d1a" opacity="0.8"/>
  <ellipse cx="700" cy="330" rx="50" ry="75" fill="#1a3d1a" opacity="0.8"/>
  
  <!-- Left foreground tree -->
  <rect x="20" y="280" width="90" height="220" fill="#5c3d2e" rx="8"/>
  <ellipse cx="65" cy="250" rx="130" ry="110" fill="#3d7a3d"/>
  <ellipse cx="30" cy="240" rx="90" ry="90" fill="#4a9a4a"/>
  <ellipse cx="100" cy="235" rx="95" ry="95" fill="#4a9a4a"/>
  
  <!-- Right foreground tree -->
  <rect x="690" y="280" width="90" height="220" fill="#5c3d2e" rx="8"/>
  <ellipse cx="735" cy="250" rx="130" ry="110" fill="#3d7a3d"/>
  <ellipse cx="700" cy="240" rx="90" ry="90" fill="#4a9a4a"/>
  <ellipse cx="770" cy="235" rx="95" ry="95" fill="#4a9a4a"/>
  
  <!-- Mid-ground trees -->
  <rect x="150" y="330" width="70" height="170" fill="#4a2a0a" rx="6"/>
  <ellipse cx="185" cy="310" rx="100" ry="80" fill="#357a35"/>
  
  <rect x="580" y="330" width="70" height="170" fill="#4a2a0a" rx="6"/>
  <ellipse cx="615" cy="310" rx="100" ry="80" fill="#357a35"/>
  
  <!-- Forest floor path -->
  <ellipse cx="400" cy="480" rx="280" ry="70" fill="#8b7355" opacity="0.7"/>
  
  <!-- Rocks and logs on ground -->
  <ellipse cx="200" cy="470" rx="35" ry="22" fill="#6b6b6b"/>
  <ellipse cx="600" cy="480" rx="40" ry="24" fill="#6b6b6b"/>
  <rect x="300" y="490" width="80" height="20" fill="#5c4a3a" rx="3" opacity="0.8"/>
  <rect x="420" y="495" width="90" height="18" fill="#5c4a3a" rx="3" opacity="0.8"/>
  
  <!-- Ground grass tufts -->
  <ellipse cx="120" cy="510" rx="35" ry="12" fill="#5a8a3a"/>
  <ellipse cx="680" cy="515" rx="40" ry="14" fill="#5a8a3a"/>
  <ellipse cx="400" cy="540" rx="50" ry="15" fill="#5a8a3a"/>
  
  <!-- Bushes -->
  <ellipse cx="100" cy="450" rx="45" ry="35" fill="#5a8a3a"/>
  <ellipse cx="700" cy="445" rx="50" ry="38" fill="#5a8a3a"/>
</svg>