<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5bb3f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87ceeb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d7a2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5016;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="800" height="350" fill="url(#skyGrad)"/>
  
  <!-- Clouds -->
  <ellipse cx="200" cy="80" rx="80" ry="40" fill="#f0f0f0" opacity="0.8"/>
  <ellipse cx="250" cy="75" rx="70" ry="35" fill="#f0f0f0" opacity="0.8"/>
  <ellipse cx="150" cy="85" rx="50" ry="30" fill="#f0f0f0" opacity="0.7"/>
  
  <ellipse cx="550" cy="120" rx="75" ry="38" fill="#f0f0f0" opacity="0.8"/>
  <ellipse cx="600" cy="115" rx="65" ry="33" fill="#f0f0f0" opacity="0.8"/>
  <ellipse cx="505" cy="125" rx="55" ry="32" fill="#f0f0f0" opacity="0.7"/>
  
  <!-- Far forest background -->
  <rect y="300" width="800" height="300" fill="url(#groundGrad)"/>
  
  <!-- Far trees (dark silhouettes) -->
  <ellipse cx="150" cy="320" rx="60" ry="80" fill="#1a3d1a" opacity="0.6"/>
  <ellipse cx="300" cy="310" rx="70" ry="85" fill="#1a3d1a" opacity="0.6"/>
  <ellipse cx="450" cy="315" rx="65" ry="80" fill="#1a3d1a" opacity="0.6"/>
  <ellipse cx="600" cy="320" rx="70" ry="85" fill="#1a3d1a" opacity="0.6"/>
  <ellipse cx="750" cy="310" rx="60" ry="80" fill="#1a3d1a" opacity="0.6"/>
  
  <!-- Foreground trees (large) -->
  <!-- Left tree trunk and foliage -->
  <rect x="40" y="280" width="80" height="200" fill="#4a2a0a" rx="10"/>
  <ellipse cx="80" cy="260" rx="110" ry="100" fill="#2d6b2d"/>
  <ellipse cx="50" cy="240" rx="80" ry="80" fill="#3d7a3d"/>
  <ellipse cx="110" cy="250" rx="80" ry="85" fill="#3d7a3d"/>
  
  <!-- Right tree trunk and foliage -->
  <rect x="680" y="280" width="80" height="200" fill="#4a2a0a" rx="10"/>
  <ellipse cx="720" cy="260" rx="110" ry="100" fill="#2d6b2d"/>
  <ellipse cx="690" cy="240" rx="80" ry="80" fill="#3d7a3d"/>
  <ellipse cx="750" cy="250" rx="80" ry="85" fill="#3d7a3d"/>
  
  <!-- Ground path -->
  <ellipse cx="400" cy="500" rx="300" ry="80" fill="#8b6f47" opacity="0.8"/>
  
  <!-- Rocks -->
  <ellipse cx="250" cy="480" rx="35" ry="25" fill="#7a7a7a"/>
  <ellipse cx="550" cy="490" rx="30" ry="22" fill="#7a7a7a"/>
  <ellipse cx="150" cy="490" rx="25" ry="20" fill="#7a7a7a"/>
  <ellipse cx="650" cy="485" rx="28" ry="21" fill="#7a7a7a"/>
  
  <!-- Ground grass/vegetation -->
  <ellipse cx="200" cy="520" rx="40" ry="15" fill="#5a8a3a" opacity="0.7"/>
  <ellipse cx="400" cy="530" rx="50" ry="18" fill="#5a8a3a" opacity="0.7"/>
  <ellipse cx="600" cy="520" rx="45" ry="16" fill="#5a8a3a" opacity="0.7"/>
</svg>